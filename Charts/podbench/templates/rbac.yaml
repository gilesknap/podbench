{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "podbench.fullname" . }}
  labels:
    {{- include "podbench.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- if .Values.rbac.observe }}
  # Read the target's spec: the launcher needs the target container's UID and
  # securityContext before it can pick a rung of the capability ladder, and
  # never defaults the fallback to root.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Attaching the debug seat. `update` is the one that matters: podbench adds the
  # container by PUTting the ephemeralcontainers subresource rather than shelling
  # out to `kubectl debug`, which merges its own profile over the spec afterwards
  # and can hand back a rung that is invalid by construction.
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "patch", "update"]
  # The transport. This is the whole network story: ssh is tunnelled over exec,
  # so no Service, no port-forward and no pod IP reachability is required.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.rbac.iterate }}
  # Iterate mode mints a sacrificial dev pod authored from the target's spec, and
  # deletes it on teardown.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  # Only needed for `--take-traffic`, which is opt-in: repointing a Service at the
  # dev pod is how the edit becomes visible through the Service, and it is also
  # how someone accidentally takes production traffic.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.rbac.resize }}
  # On a live pod podbench shares the workload's memory limit and cannot reserve
  # its own, so a large editor session can get the workload OOM-killed. In-place
  # resize is the mitigation; it is granted separately because it changes a
  # running workload's limits.
  # `get` as well as `patch`: kubectl reads the subresource back before it sends
  # the write, so `patch` alone gets a Forbidden on the GET and never reaches
  # the resize (measured on hgv27681, 2026-08-20).
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["get", "patch"]
  {{- end }}
  {{- if .Values.rbac.hotfix }}
  # Hotfix mode builds on rbac.observe — it reads the pod to find the application
  # container and its imageID, and reaches the claim by exec'ing into the seat —
  # and adds only this.
  #
  # Read-only apart from one deletion, and that is the whole grant now. It used
  # to include `patch` on
  # deployments and statefulsets, and `patch`/`delete` on pods, because
  # provenance went on the workload's pod template and the template edit was
  # also what rolled the workload. That verb deployed code, and it was the most
  # privileged thing podbench asked for anywhere.
  #
  # None of it is needed since the relaunch moved inside the container. The
  # provenance lives on the claim, where a GitOps controller cannot strip it,
  # and `apply` holds and re-execs the application's own child rather than
  # replacing the pod. Hotfix mode is now, in cluster terms, no more privileged
  # than watching — `rbac.observe` plus a read-only walk to the owning workload.
  #
  # That walk is what refuses a multi-replica target, which matters because the
  # claim is ReadWriteOnce and two writers on one checkout is a race with no
  # winner.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get"]
  # Retirement, and the one write left in this grant. `podbench hotfix retire`
  # reads the claim to say which steps of a retirement have landed, and
  # `--delete-claim` performs the last one — once nothing mounts it. That step
  # is the one nobody does, which is how a claim goes on shadowing an image the
  # fix is already in; the claim carries Prune=false,Delete=false precisely so
  # that no sync will ever do it for them.
  #
  # `get` and `list` are both needed and are different questions: the pod names
  # its claim while it is still wired, and once it is not, the only thing left
  # pointing at the claim is the podbench.dev/hotfix-target label on the object
  # itself.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  {{- end }}
{{- if .Values.rbac.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "podbench.fullname" . }}
  labels:
    {{- include "podbench.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "podbench.fullname" . }}
subjects:
  {{- toYaml .Values.rbac.subjects | nindent 2 }}
{{- end }}
{{- end }}
