# yaml-language-server: $schema=values.schema.json

# Default values for podbench.
#
# This file, plus the `# @schema` comments in it, generates values.schema.json
# (see .schema.config.yaml); helm then refuses a mistyped key at install time
# rather than at attach time. The lists that default to `[]` get their item
# shape from example.values.yaml, since an empty list infers nothing.
#
# Nothing here is required to *use* podbench: Observe and Iterate mode work
# against any pod, from any chart, completely unmodified — that is the design
# principle the tool is built on. This chart exists for the three things that
# genuinely cannot be done from the client side: granting a team permission to
# attach at all, giving Iterate mode a workspace that outlives a dev pod, and
# providing the volume Hotfix mode needs to have been in the pod spec at creation.

nameOverride: ""
fullnameOverride: ""

# The debug image the launcher attaches. Recorded here so a cluster can pin a
# digest and reference it from an admission policy; the launcher's --image flag
# and the chart should agree.
image:
  repository: ghcr.io/gilesknap/podbench
  # Pin a digest in production. An admission policy that allows CAP_SYS_PTRACE
  # for "this pinned image, as an ephemeral container only" is a far easier ask
  # of a security team than "privileged", and is only writable against a pinned,
  # published image.
  tag: ""
  pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]

rbac:
  # Create a Role granting the verbs podbench needs. Off by default: a cluster
  # may prefer to fold these verbs into an existing developer role.
  create: false

  # Bind the Role to these subjects. Each entry is passed through to the
  # RoleBinding's subjects list, e.g.
  #   - kind: Group
  #     name: developers
  #     apiGroup: rbac.authorization.k8s.io
  subjects: []

  # Which capabilities the Role grants. They are separated because they are
  # genuinely different levels of trust: observing a pod is not the same as
  # being able to create and delete pods in the namespace.
  observe: true # read pods, add an ephemeral container, exec into it
  iterate: false # create and delete dev pods, patch a Service selector
  # get and patch, not patch alone: kubectl reads the subresource back before
  # it writes it, so `patch` on its own is Forbidden on the GET and never
  # reaches the resize (measured on a Diamond cluster, 2026-08-20).
  resize: false # get+patch pods/resize, to make memory headroom before attaching
  # Hotfix mode: read Deployments/StatefulSets/ReplicaSets to find the pod
  # template and refuse a multi-replica target, then patch that template with the
  # provenance annotations — which is also what rolls the workload. That makes it
  # a code-deploying grant, so it is the one to hand out most sparingly. Assumes
  # observe as well; on its own it cannot read a pod or reach the claim.
  hotfix: false

# The scratch workspace PVC for Iterate mode. Created by this chart only —
# there is no `podbench init` verb; the launcher never creates a claim.
#
# Iterate mode uses an emptyDir today and works with zero setup, at the cost of
# losing the workspace when the dev pod goes away. This claim is here for the
# durable version of that: ReadWriteOnce is fine — one dev pod mounts it — at the
# cost of pinning that pod to the volume's node. `podbench dev` has no flag to
# mount it yet, so enabling this creates a claim nothing consumes.
scratchPvc:
  enabled: false
  name: "" # defaults to <release>-scratch
  size: 20Gi
  storageClassName: ""
  # @schema itemEnum:[ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod]
  accessModes:
    - ReadWriteOnce

# Hotfix mode (design brief Phase 6).
#
# Durable-across-restart code has to sit on a volume that was present in the pod
# spec at creation: pod volumes are immutable and a container's rootfs is reset on
# every restart. This chart creates the PVC; the application's own chart must
# mount it over its venv path. `podbench hotfix --print-values` emits the snippet.
#
# This is the one place podbench asks for deploy-time cooperation, and it is
# deliberately the last thing in the design for that reason.
hotfixVenv:
  enabled: false
  # One entry per application whose venv may be hotfixed.
  #   - name: myapp
  #     size: 2Gi
  #     storageClassName: ""
  claims: []

# The seat's identity, for a seat that is an ordinary container.
#
# A PSA-`restricted` namespace forbids the ptrace rung, so the seat runs as the
# *target's* own uid instead — and a stock image has no /etc/passwd entry for
# that uid. sshd will not authenticate a user NSS cannot resolve, and ssh-keygen
# will not even mint a host key without one (it calls getpwuid() regardless of
# -C). /etc/passwd is 644 root:root, so the seat cannot write one for itself
# either. This ConfigMap is that identity, projected as two files.
#
# Which command it serves is the thing to get right:
#
# * `podbench dev` authors an ordinary pod, where a volumeMount may carry a
#   subPath and so a single file can be landed at /etc/passwd. That is where a
#   projected identity belongs — nothing is written at runtime and the seat
#   needs no group-0. (The dev sidecar does not mount it yet; until it does,
#   this ConfigMap is deployment furniture that nothing consumes.)
# * `podbench attach` authors an *ephemeral* container, where subPath is
#   forbidden outright — the API server refuses the whole request with
#   `Forbidden: cannot be set for an Ephemeral Container`. A live-pod seat
#   therefore writes its own record instead, at start-up, into an NSS database
#   the debug image ships for the purpose — no flag, and nothing asked of this
#   chart (issue #102). Declaring the volume does not help an attach, and
#   podbench will not mount it into one.
#
# This chart emits the ConfigMap. It cannot put it into anybody's pod — the
# application's own chart must declare the volume, the same cooperation
# hotfixVenv already needs; `podbench hotfix --print-values` emits both halves.
# Enabling this on its own therefore changes nothing about any running pod: it
# creates a ConfigMap that nothing yet mounts.
seatIdentity:
  enabled: false
  # One entry per application whose pods should carry the identity. uid and gid
  # must be the application container's *own* (its runAsUser/runAsGroup, or
  # whatever its image's USER resolves to): the whole point is an account that
  # resolves at the uid the seat is forced to run as, so a wrong number here is
  # a seat that authenticates as nobody.
  #   - name: myapp
  #     uid: 1000
  #     gid: 1000
  #     configMapName: "" # defaults to <name>-podbench-identity
  apps: []

# Free-form, so the schema only constrains them to the string values Kubernetes
# accepts for a label or an annotation — `noAdditionalProperties` would
# otherwise turn an empty map into "no keys allowed". A number therefore needs
# `--set-string`, which is what the API server wants anyway.
# @schema additionalProperties: {type: string}
commonLabels: {}
# @schema additionalProperties: {type: string}
commonAnnotations: {}
