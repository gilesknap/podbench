# Config for `helm schema` (github.com/losisin/helm-values-schema-json), which
# regenerates values.schema.json from values.yaml on every commit. The paths are
# relative to the repository root, because pre-commit runs the hook from there.
#
# Never edit values.schema.json by hand: it is generated, and the pre-commit hook
# rewrites it.

values:
  - Charts/podbench-hotfix-claim/values.yaml

output: Charts/podbench-hotfix-claim/values.schema.json

# helm validates values.schema.json on install, so a typo becomes a refusal at
# the point of the typo. That matters more here than in most charts: this one is
# a dependency a service inherits, so `enabld: true` would otherwise render
# nothing and be indistinguishable from a claim the cluster refused.
noAdditionalProperties: true

schemaRoot:
  title: podbench hotfix claim
  description: The PersistentVolumeClaim podbench Hotfix mode needs beside a pod
  additionalProperties: false

# No `$ref` to the Kubernetes schemas, for the reason spelled out in the sibling
# chart's config: helm's validator resolves a remote `$ref` over the network at
# install time, and this chart is rendered on every sync of every service that
# inherits the dependency.
bundle: false
k8sSchemaVersion: v1.34.10
