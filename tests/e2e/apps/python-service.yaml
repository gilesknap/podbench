# A small Python service behind a Service, for the Iterate-mode regression.
#
# Lifted from spike S4 (docs/explanations/spikes/s4.md §1, "Target workload")
# and changed in one way: the ConfigMap now carries an *installable* package
# (`pyproject.toml` + `demo_service.py`) rather than a loose script. S4's
# headline claim is "edit code, curl the Service, see your change" through a
# `uv pip install -e .`, so the demo app has to be something that can be
# editable-installed, and the same two files are the seed for the git repo the
# dev pod clones.
#
# No image is built: python:3.12-slim runs the ConfigMap directly. That keeps
# the whole app buildable from public images on a runner with only kubectl.
#
# Applied with `kubectl apply -n <scratch namespace> -f python-service.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-service-src
data:
  # Flat module rather than a package directory: ConfigMap keys cannot contain
  # `/`, and the e2e test copies these keys verbatim into the dev pod's
  # workspace to seed the git repo.
  pyproject.toml: |
    [project]
    name = "demo-service"
    version = "0.1.0"
    requires-python = ">=3.11"

    [build-system]
    requires = ["setuptools>=64"]
    build-backend = "setuptools.build_meta"

    [tool.setuptools]
    py-modules = ["demo_service"]
  demo_service.py: |
    """The demo workload. MESSAGE is the string the Iterate test edits."""

    import http.server
    import os
    import socketserver

    MESSAGE = "PODBENCH-ORIGINAL-v1"

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok"
            else:
                body = f"{MESSAGE} from {os.environ.get('HOSTNAME', '?')}".encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    def main(port=8080):
        # allow_reuse_address only. Never SO_REUSEPORT: a second REUSEPORT bind
        # succeeds silently and the kernel splits traffic between old and new
        # code, which is report §3.16's most dangerous relaunch failure and is
        # not something a demo app should be able to hide.
        socketserver.TCPServer.allow_reuse_address = True
        with socketserver.TCPServer(("0.0.0.0", port), Handler) as server:
            server.serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  labels:
    app: demo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
        tier: demo
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/src/demo_service.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: src
              mountPath: /src
          # All three probes are here on purpose. The dev pod must come out with
          # none of them on the idled app container (report §4.4) — a liveness
          # probe against `sleep infinity` would kill the pod — so the origin
          # has to carry probes for that to be worth asserting.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: src
          configMap:
            name: demo-service-src
---
apiVersion: v1
kind: Service
metadata:
  name: demo-service
spec:
  selector:
    app: demo-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
