on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: If true, pushes image to container registry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export to Docker local cache
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: tag_for_testing
      - name: Test CLI works in cached runtime image
        run: docker run --rm tag_for_testing --version
      - name: Create tags for publishing image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # PROTOTYPE: remove with the branch trigger in ci.yml once beta tags
            # are again the way branch images are published.
            type=raw,value=prototype-attach-hotfix,enable=${{ github.ref == 'refs/heads/prototype/attach-hotfix' }}
      - name: Push cached image to container registry
        # PROTOTYPE: remove the branch clause when the temporary image retires.
        if: inputs.publish && (github.ref_type == 'tag' || github.ref == 'refs/heads/prototype/attach-hotfix')
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
