on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: If true, pushes image to container registry

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # podbench must run on both the amd64 and arm64 nodes of a mixed cluster, so
  # the published image is a multi-arch manifest. Each architecture is built on a
  # runner of that architecture — GitHub's arm64 runners are free for public
  # repositories — rather than cross-built under QEMU. Emulating this image is
  # expensive (apt, a uv sync and a managed CPython install), and an emulated
  # build cannot run the smoke tests below, so the arm64 half used to ship
  # having never executed anywhere.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create labels for the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      # Loaded into the local daemon so the smoke tests can run it. This is the
      # runner's own architecture, so there is no emulation involved and the
      # tests below are a real execution of the artefact being published.
      - name: Build and export to Docker local cache
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: tag_for_testing
          # Scoped per platform: one shared scope would have the two runners
          # evicting each other's layers on every build.
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Test cli works in cached runtime image
        run: docker run --rm tag_for_testing --version

      # The image is only useful in a cluster, so exercise the in-pod verbs too:
      # they are the surface `podbench` drives once attached.
      #
      # Driven through /usr/local/bin/podbench by absolute path, which is the
      # only helper there is now the per-subcommand wrappers are gone, and the
      # one an `ssh <seat> podbench …` finds. Naming it in full rather than
      # letting PATH pick is deliberate: the ENV PATH puts /app/.venv/bin first,
      # so a bare `podbench` would test the venv and leave the shim - the file
      # every ssh session actually resolves - untested.
      #
      # `podbench` is in the `command -v` list for the other half of that: a
      # bare name is exactly what `CAPREPORT_ARGV` and `AGENT_COMMAND` send over
      # `kubectl exec`, which inherits the ENV PATH, so a Dockerfile that lost
      # that line would break both with every other check still green.
      - name: Test in-pod verbs are present and self-report
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/podbench tag_for_testing capreport --json
          docker run --rm --entrypoint /usr/local/bin/podbench tag_for_testing pids --help
          docker run --rm --entrypoint sh tag_for_testing -c 'command -v podbench gdb sshd uv git'

      # `agent.extrausers_serves` decides which passwd database a seat registers
      # in from three numbers compiled into libnss-extrausers - MINUID, MINGID
      # and the USERSGID exemption - which it carries as literals because
      # nothing reveals them at runtime. The package is installed unversioned,
      # so a Debian update could move them, and the failure is silent in the
      # worst possible way: the seat appends its record, the line is in the
      # file, and nothing resolves. A capless non-root seat then has no ssh,
      # which is issue #102 over again.
      #
      # Asserted rather than pinned to an apt version: a pinned version rots as
      # soon as the archive supersedes it, failing the build on a version that
      # no longer exists, and a version string only *implies* the behaviour the
      # code depends on.
      #
      # **Each record isolates one constant**, which is the whole design of this
      # step. Probing only "something high is served, something low is not"
      # would pass unchanged against a build with MINUID=200 - every probe still
      # gives the same answer - while `extrausers_serves` sent a uid-300 seat to
      # /etc/passwd, which on a non-zero gid it cannot write. So the pair 500 and
      # 499 pins MINUID from both sides, 501:499 pins MINGID without moving the
      # uid, 502:100 pins the exemption, and 36071:0 keeps the `--seat-gid-root`
      # shape explicit because it is the one whose mis-routing costs a user ssh.
      #
      # The wiring proof is what makes every refusal mean something: 36070:36070
      # resolving out of the same file in the same run says the database is
      # consulted at all, so a refusal below a floor is the floor and not a
      # missing nsswitch line. uids 499-502 are safe to probe with because the
      # runtime image's highest system uid is 100 (sshd) - a uid `files` could
      # answer would make this step lie.
      - name: Test the NSS database's floors are what the agent assumes
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh tag_for_testing -c '
            set -eu
            db=/var/lib/extrausers/passwd
            printf "%s\n" "pbwire:x:36070:36070:pbwire:/tmp:/bin/sh"       >> "$db"
            printf "%s\n" "pbuidat:x:500:500:pbuidat:/tmp:/bin/sh"         >> "$db"
            printf "%s\n" "pbuidbelow:x:499:500:pbuidbelow:/tmp:/bin/sh"   >> "$db"
            printf "%s\n" "pbgidbelow:x:501:499:pbgidbelow:/tmp:/bin/sh"   >> "$db"
            printf "%s\n" "pbgidusers:x:502:100:pbgidusers:/tmp:/bin/sh"   >> "$db"
            printf "%s\n" "pbgidzero:x:36071:0:pbgidzero:/tmp:/bin/sh"     >> "$db"
            fail=0
            # `if`, not `&&`/`||`: a failing AND-OR list is ignored by `set -e` at
            # top level but becomes a function`s return status, so `refused` would
            # abort the script on the first correctly-refused probe.
            served()  { if ! getent passwd "$1" >/dev/null; then echo "FAIL: $1 not served - $2"; fail=1; fi; }
            refused() { if getent passwd "$1" >/dev/null;   then echo "FAIL: $1 was served - $2"; fail=1; fi; }
            served  pbwire      "the database is not consulted at all - is extrausers in nsswitch.conf?"
            served  pbuidat     "uid 500 must be at or above MINUID"
            refused pbuidbelow  "uid 499 must be below MINUID, so MINUID has moved"
            refused pbgidbelow  "gid 499 must be below MINGID, so MINGID has moved"
            served  pbgidusers  "gid 100 must stay the USERSGID exemption"
            refused pbgidzero   "gid 0 must be refused, or --seat-gid-root routing is now wrong"
            [ "$fail" = 0 ] || { echo "agent.extrausers_serves needs updating to match this build"; exit 1; }
            echo "floors pinned: MINUID 500, MINGID 500, USERSGID 100 - as agent.extrausers_serves assumes"
          '

      # Pushed by digest and left untagged: a per-architecture tag would be a
      # published artefact people could pull by accident. The merge job below is
      # what gives these digests their tags, as a single manifest list.
      # Any push publishes; a pull_request never does. That is wider than it
      # used to be (tag or `main`) because a branch image is the only way to run
      # an in-image change against a real cluster — see the trigger comment in
      # `ci.yml`. The event test, not a ref test, is what keeps a fork's PR out:
      # the login step above is skipped for `pull_request`, so a push here would
      # fail on credentials rather than leak one.
      - name: Push image by digest
        id: push
        if: inputs.publish && github.event_name == 'push'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same scope as the build above, which has just populated it, so this
          # is a re-export of cached layers rather than a second build.
          cache-from: type=gha,scope=${{ matrix.slug }}

      - name: Export the digest
        if: steps.push.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload the digest
        if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          # One file per architecture, merged by name in the job below.
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The manifest list is assembled from digests rather than by a second build, so
  # the bytes published under a tag are exactly the bytes the smoke tests ran.
  merge:
    needs: build
    if: inputs.publish && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Only a branch build needs the repo, and only for `git describe` below.
      # `docker/metadata-action` reads the ref out of the event context, so the
      # tag and `main` paths still run without a checkout, as they always have.
      - name: Checkout
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          # `git describe` needs the tag history, and a shallow clone has none.
          fetch-depth: 0

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # One release has two spellings: the git tag, chart and image use SemVer
      # (1.0.0-beta.1) while the wheel — and so podbench.__version__ — uses
      # PEP 440 (1.0.0b1). Publishing both as tags on one digest means the
      # launcher can ask for its own version verbatim instead of translating,
      # which would risk an ImagePullBackOff in an unrestartable ephemeral
      # container. The normalisation is done by packaging itself, so it is the
      # same code PyPI will apply to the wheel rather than an imitation of it.
      #
      # A branch build asks the same parser a different question, below, so both
      # paths need uv.
      - name: Install uv
        if: github.ref_type == 'tag' || github.ref != 'refs/heads/main'
        uses: astral-sh/setup-uv@v10.0.0

      # A branch image must be unmistakably not-a-release, and must sort after
      # the release it descends from. SemVer gives both for free: appending an
      # identifier extends a prerelease and orders after it, so
      # `0.1.0-beta.4-my-branch` reads as "past beta.3, on a branch" and cannot
      # collide with the eventual `0.1.0-beta.4` tag — different strings, and
      # the real release sorts ahead of every branch that anticipated it.
      #
      # The bump is a guess about the *name* of the next release and nothing
      # depends on it being right; if the tag convention ever stops ending in a
      # number the guess is skipped rather than fabricated, because a tag that
      # sorted *before* its parent would be worse than a longer one.
      - name: Compute the branch prerelease tag
        id: branch
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0)
          suffix=${last##*.}
          if [[ $suffix =~ ^[0-9]+$ ]]; then
            base="${last%.*}.$((suffix + 1))"
          else
            echo "::notice::last tag $last does not end in a number, not bumping"
            base="$last"
          fi
          # OCI tags are [A-Za-z0-9_][A-Za-z0-9._-]{0,127} and a branch name is
          # none of those things: it carries slashes, and may carry anything
          # else a person typed. Fold the unusable characters to `-`, collapse
          # the runs and trim, so `feat/debug-config` becomes `feat-debug-config`.
          slug=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9._-]/-/g' -e 's/-\{2,\}/-/g' -e 's/^[-._]*//' -e 's/[-._]*$//' \
            | cut -c1-60)
          if [[ -z $slug ]]; then
            echo "::error::branch name $GITHUB_REF_NAME slugifies to nothing"
            exit 1
          fi
          # Two assertions, because the tag answers to two grammars and only the
          # *base* answers to PEP 440. `packaging` parses `0.1.0-beta.4` — and
          # so can say whether it is a prerelease, which is the property that
          # matters — but rejects the branch slug outright, because SemVer
          # allows a prerelease identifier PEP 440 has no spelling for. Asking
          # it about the whole tag would be a check that always fails.
          uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; sys.exit(0 if Version(sys.argv[1]).is_prerelease else "not a prerelease, so a branch image could be mistaken for a release: " + sys.argv[1])' \
            "$base"
          # The second grammar is the registry's. `distribution`'s TagRegexp is
          # narrower than either version spelling, and a reference it rejects is
          # a malformed request rather than a failed pull — the same regex
          # `podbench.model` applies before asking for an image.
          if [[ ! $base-$slug =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::computed tag is not a valid OCI tag: $base-$slug"
            exit 1
          fi
          echo "tag=$base-$slug" >> "$GITHUB_OUTPUT"

      # `prerelease` comes from the same parse, because "does the tag contain a
      # hyphen" is a fact about *our* SemVer tag convention, not about
      # prereleases: PEP 440's normal form has no separator at all (1.0.0rc1),
      # so a tag in that spelling would read as final to a string test and take
      # `latest` with it. This guard has already been wrong once; ask the parser.
      - name: Normalise the tag the way PyPI will
        id: ver
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # Assigned on its own line deliberately: `set -e` ignores a failing
          # command substitution used as an argument, so folding this into the
          # `echo` would let an unparseable tag pass silently as `pep440=`,
          # publishing a release the launcher's own version cannot name.
          parsed=$(uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; v = Version(sys.argv[1]); print(f"pep440={v}"); print(f"prerelease={str(v.is_prerelease).lower()}")' \
            "$GITHUB_REF_NAME")
          echo "$parsed" >> "$GITHUB_OUTPUT"

      - name: Create tags for publishing image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # metadata-action's default is `latest=auto`, which adds `latest` to
          # any `type=ref,event=tag` build — it has no idea the tag is a
          # prerelease. That silently beat the `enable=` guard below on
          # 0.1.0-beta.1 and moved `latest` onto the beta. Turning the flavour
          # off leaves the explicit rule as the only thing that can emit it.
          flavor: latest=false
          # `main` and `sha-` tags let a cluster track the tip of the default
          # branch during development, and `main` is also what a launcher built
          # off a checkout asks for (podbench.model.FLOATING_TAG), so it has to
          # keep moving with every default-branch push. The git tag, its PEP 440
          # spelling and — for a final release only — `latest` are the released
          # artefacts. Moving `latest` onto a prerelease would hand it to every
          # unpinned user, so the verdict comes from `packaging`, above.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.ver.outputs.pep440 }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.ver.outputs.prerelease == 'false' }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ steps.branch.outputs.tag != '' }}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}

      # Asserted rather than trusted: the tag list is assembled by an action
      # whose defaults have already put `latest` on a prerelease once, and the
      # only place that mistake shows up is the registry, days later, on the
      # machine of whoever pulled an unpinned image.
      - name: Refuse to move `latest` onto a prerelease
        if: github.ref_type == 'tag' && steps.ver.outputs.prerelease == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if jq -e '.["tag-names"] | index("latest")' <<< "$TAGS" > /dev/null; then
            echo "::error::$GITHUB_REF_NAME is a prerelease, but the computed" \
                 "tags include \`latest\`: $(jq -c '.["tag-names"]' <<< "$TAGS")"
            exit 1
          fi

      # The same assertion for the tags a *branch* must never claim. `main` is
      # the one that matters: `podbench.model.FLOATING_TAG` is `main`, so every
      # launcher built off a checkout pulls it. A branch quietly taking that tag
      # would hand unreviewed code to everyone running from source, and the
      # symptom would appear in an ephemeral container that cannot be restarted.
      - name: Refuse to publish a branch under a released tag
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if jq -e '.["tag-names"] | index("latest") // index("main")' <<< "$TAGS" > /dev/null; then
            echo "::error::branch $GITHUB_REF_NAME computed a released tag:" \
                 "$(jq -c '.["tag-names"]' <<< "$TAGS")"
            exit 1
          fi

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      # Inspected by a tag that was actually emitted rather than by
      # `steps.meta.outputs.version`: on a branch push that output is derived
      # from the ref, and the branch name is deliberately *not* one of the tags
      # this job publishes, so it would name an image that does not exist.
      - name: Inspect the pushed manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
