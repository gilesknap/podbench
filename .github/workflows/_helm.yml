name: Package Helm chart

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: Push charts to GHCR on a release tag

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: Azure/setup-helm@v5
        with:
          version: 3.17.1
      - name: Validate tag version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
      - name: Lint and render charts
        run: |
          set -eu
          for chart in Charts/*/; do
            helm lint "${chart%/}"
            helm template test "${chart%/}" > /dev/null
          done
          helm template test Charts/podbench-hotfix-claim \
            --set enabled=true > /dev/null
      - name: Package charts
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          set -eu
          mkdir -p charts
          for chart in Charts/*/; do
            helm package -d charts --version "$VERSION" \
              --app-version "$VERSION" "${chart%/}"
          done
      - name: Upload Helm chart values schemas
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-schemas
          path: schemas/*
      - name: Log in to GHCR
        if: inputs.publish && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push charts
        if: inputs.publish && github.ref_type == 'tag'
        run: |
          set -eu
          for chart in charts/*.tgz; do
            helm push "$chart" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          done
