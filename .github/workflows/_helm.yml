name: Package helm chart

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: If true, pushes the chart to the OCI registry on tags

env:
  HELM_VERSION_TO_INSTALL: 3.17.1

jobs:
  package-helm-chart:
    name: Package and Push Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need the full tag history so the packaged version matches the release.
          fetch-depth: 0

      - name: Install helm
        uses: Azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}

      # Check that alpha/beta versions have the form X.Y.Z-alpha.A required by Helm.
      # An early check saves waiting for the package step before finding a problem.
      - name: Check helm version tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((-alpha|-beta|-rc)\.[0-9]+)?$ ]]; then
            echo "Valid version format: '${VERSION}'"
          else
            echo "Invalid version: '${VERSION}'. Expected 'X.Y.Z' or 'X.Y.Z-beta.1' or 'X.Y.Z-alpha.1'"
            exit 1
          fi

      # Every chart under Charts/, so adding one does not need this file edited
      # again. podbench-hotfix-claim is the second: a dependency a target chart
      # declares, published alongside the release it belongs to.
      - name: Lint helm charts
        run: |
          set -xe
          for chart in Charts/*/; do
            helm lint "${chart%/}"
          done

      # Rendering with the demo values proves the templates actually produce valid
      # manifests, which `helm lint` alone does not guarantee.
      - name: Render helm charts
        run: |
          set -xe
          helm template podbench Charts/podbench > /dev/null
          helm template podbench Charts/podbench \
            --set scratchPvc.enabled=true \
            --set rbac.create=true > /dev/null
          # Both directions for the subchart, because rendering *nothing* until
          # asked is its whole contract: a service that inherits the dependency
          # and never sets the boolean must be unchanged by having it.
          if helm template svc Charts/podbench-hotfix-claim | grep -q "^kind:"; then
            echo "podbench-hotfix-claim rendered an object with enabled unset"
            exit 1
          fi
          helm template svc Charts/podbench-hotfix-claim --set enabled=true > /dev/null

      # Attached to the GitHub release by `_release.yml`, which gives the schema
      # a stable per-tag URL a site's own values file can point
      # `# yaml-language-server: $schema=` at. Uploaded from here rather than
      # committed into the release job's workdir because that job deliberately
      # downloads named artifacts only.
      # `values.schema.json` keeps its bare name: it is the URL
      # docs/tutorials/setup.md tells sites to point their
      # `# yaml-language-server: $schema=` line at, and renaming it would break
      # every values file already doing so. The second chart's is qualified.
      - name: Collect the chart values schemas
        run: |
          set -xe
          mkdir -p schemas
          cp Charts/podbench/values.schema.json schemas/values.schema.json
          cp Charts/podbench-hotfix-claim/values.schema.json \
            schemas/podbench-hotfix-claim.values.schema.json

      - name: Upload the chart values schemas
        uses: actions/upload-artifact@v7
        with:
          name: chart-schema
          path: schemas/

      - name: Package helm charts
        env:
          # Stamp the real version from the tag; off a tag it stays at 0.0.0 so a PR
          # build still produces a (throwaway) package and exercises packaging.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          set -xe
          mkdir -p charts
          # `-d charts` rather than a glob-and-move: `podbench-*.tgz` also
          # matches podbench-hotfix-claim's package, so a move is one chart's
          # name away from being wrong.
          for chart in Charts/*/; do
            helm package -u -d charts \
              --app-version "${VERSION}" --version "${VERSION}" "${chart%/}"
          done

      - name: Push tagged helm charts to registry
        if: inputs.publish && github.ref_type == 'tag'
        run: |
          set -x
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io/${{ github.repository_owner }} --username ${{ github.repository_owner }} --password-stdin
          REGISTRY=oci://ghcr.io/${{ github.repository_owner }}/charts
          for i in charts/*.tgz; do
            helm push "${i}" "${REGISTRY,,}"
          done
