on:
  workflow_call:
    inputs:
      tox:
        type: string
        description: What to run under tox
        required: true
      helm:
        type: boolean
        description: Install Helm and the schema plugin used by pre-commit
        default: false

env:
  HELM_VERSION_TO_INSTALL: 3.17.1
  HELM_SCHEMA_PLUGIN_VERSION: v2.5.0

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Helm
        if: inputs.helm
        uses: Azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}
      - name: Install Helm schema plugin
        if: inputs.helm
        env:
          TAR_OPTIONS: --no-same-owner
        run: |
          helm plugin install https://github.com/losisin/helm-values-schema-json \
            --version "${HELM_SCHEMA_PLUGIN_VERSION}"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Run tox
        run: uv run --locked tox -e ${{ inputs.tox }}
