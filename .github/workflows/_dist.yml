on:
  workflow_call:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Build sdist and wheel
        run: >
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) &&
          uvx --from build pyproject-build

      - name: Upload sdist and wheel as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Check for packaging errors
        run: uvx twine check --strict dist/*

      # Running from a throwaway environment with an empty cache is the headline
      # of #1, so this is the launchability smoke test. `--no-index` is what
      # makes it also test "no runtime dependencies": without it uv would
      # happily resolve and download anything the wheel declared and still exit
      # 0. With zero dependencies the local wheel needs no index at all, so a
      # single added requirement turns this step red.
      - name: Test the wheel is launchable with uvx from a cold cache
        run: |
          set -euo pipefail
          UV_CACHE_DIR=$(mktemp -d) uvx --no-index --from dist/*.whl podbench --version

      - name: Install produced wheel
        run: python -m pip install dist/*.whl

      - name: Test module --version works using the installed wheel
        # If more than one module in src/ replace with module name to test
        run: python -m $(ls --hide='*.egg-info' src | head -1) --version
