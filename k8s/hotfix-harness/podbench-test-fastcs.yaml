# Phase 0 harness: a duplicate of bl47p-ea-fastcs-01-0 that cannot disturb the
# beamline, carrying the hold loop and an *unseeded* claim beside the project.
#
# Duplicate rules (plan "Duplicating a target without disturbing the beamline"):
#   1. hostNetwork off, so CA/PVA ports and UDP searches stay off the host net
#   2. the three shared claims dropped entirely
#   3. PV prefix renamed, so even on the pod network it cannot answer for a live IOC
#   4. podbench-test-* name + test-duplicate label, so it is greppable as a set
#   5. deleted at the end of the phase
apiVersion: v1
kind: Pod
metadata:
  name: podbench-test-fastcs
  labels:
    podbench.dev/test-duplicate: "true"
spec:
  restartPolicy: Always
  hostNetwork: false
  dnsPolicy: ClusterFirst
  securityContext:
    runAsUser: 36096
    runAsGroup: 36096
    supplementalGroupsPolicy: Strict
    # The fsGroup half of the beside-the-app layout, proved on netapp in preflight.
    fsGroup: 37887
    fsGroupChangePolicy: OnRootMismatch
  tolerations:
    - {key: beamline, operator: Equal, value: bl47p, effect: NoSchedule}
    - {key: location, operator: Equal, value: bl47p, effect: NoSchedule}
    - {key: nodetype, operator: Equal, value: training-rig, effect: NoSchedule}
  volumes:
    # Read-only, and the original: temp_controller.yaml and schema.json are used
    # as-is. controller.yaml is NOT — it carries the live PV prefix, and this
    # account cannot create a configmap to hold a renamed copy.
    - name: config-volume
      configMap:
        name: bl47p-ea-fastcs-01-config
        defaultMode: 420
    # The claim, beside the project and deliberately UNSEEDED for Phase 0.
    - name: podbench-app
      ephemeral:
        volumeClaimTemplate:
          metadata:
            labels:
              podbench.dev/test-duplicate: "true"
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
    - name: podbench-config
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  containers:
    - name: bl47p-ea-fastcs-01
      image: ghcr.io/diamondlightsource/fastcs-example-debug:2025.10.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsUser: 37887
        runAsGroup: 37887
        capabilities:
          drop: [ALL]
          add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, MKNOD,
                SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
      resources:
        requests: {cpu: 100m, memory: 103Mi, ephemeral-storage: 100Mi}
        limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
      env:
        - {name: IOC_NAME, value: podbench-test-fastcs}
        - {name: IOC_PREFIX, value: podbench-test-fastcs}
        - {name: IOCSH_PS1, value: "podbench-test-fastcs > "}
        - {name: HOME, value: /tmp}
        - {name: TERM, value: xterm-256color}
      volumeMounts:
        - {name: config-volume, mountPath: /epics/ioc/config, readOnly: true}
        - {name: podbench-config, mountPath: /podbench/config}
        - {name: podbench-app, mountPath: /podbench}
        - {name: tmp, mountPath: /tmp}
      # The wrapped liveness probe. The underlying check is a real one - the IOC's
      # CA port answering - and the wrapper short-circuits it while the hold file
      # is present, which is the whole point: a held pod has a deliberately dead
      # or restarting child, and an unwrapped probe would restart the container
      # out from under it at failureThreshold x periodSeconds.
      #
      # Timings are the live epics-containers IOC's own (bl47p-ea-simdet-01:
      # period 30, failureThreshold 3, timeout 1), so ~90s to restart. Only
      # initialDelaySeconds differs - 30 rather than 120 - to shorten setup.
      livenessProbe:
        exec:
          command:
            - bash
            - -c
            - 'if [ -e /tmp/podbench-hold ]; then exit 0; fi; exec 3<>/dev/tcp/127.0.0.1/5064'
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 3
        successThreshold: 1
        timeoutSeconds: 1
      command: [bash, -c]
      args:
        - |
          # -m puts each background job in its own process group, so the recorded
          # pid is also a process-group id and the whole tree can be signalled.
          # Without it, killing the recorded pid signals only stdio-socket: its
          # descendants are reparented onto PID 1, the original IOC keeps the CA
          # port, and the relaunched one silently fails to bind. Measured on
          # 2026-08-22 - ten relaunches, restartCount 0, still serving pid 14.
          set -u -m
          # Rule 3: our own controller.yaml, renamed prefix, GUI output redirected
          # off the (dropped) opis claim.
          sed -e 's/T01-EA-FASTCS-01/PODBENCHTEST-EA-FASTCS-01/g' \
              -e 's#/epics/opi/#/tmp/#g' \
              /epics/ioc/config/controller.yaml > /podbench/config/controller.yaml

          # The hold loop. Fail-fast with no hold file present: exits the child's
          # status and the kubelet restarts exactly as today.
          #
          # The runtime switch is *inside* the loop. Evaluated once at container
          # start it could never see a claim seeded afterwards, so the first
          # apply after an init would relaunch the image's code and report
          # success - measured 2026-08-22, restartCount 0 and the IOC still
          # /app/.venv/bin/fastcs-example.
          while :; do
            (
              if [ -x /podbench/venv/bin/fastcs-example ]; then
                export PATH=/podbench/venv/bin:$PATH
                echo "podbench: claim is seeded, running claim code"
              else
                echo "podbench: claim is unseeded, running image code"
              fi
              exec stdio-socket --ptty "fastcs-example run /podbench/config/controller.yaml"
            ) &
            child=$!
            echo $child > /tmp/podbench-child.pid
            wait $child; rc=$?
            # Reap anything the child left behind before relaunching, or the old
            # IOC keeps the port and the new one comes up deaf.
            kill -TERM -"$child" 2>/dev/null || true
            echo "podbench: child exited rc=$rc"
            [ -e /tmp/podbench-hold ] || exit $rc
            echo "podbench: held, relaunching"
          done
    - name: temp-controller-simulator
      image: ghcr.io/diamondlightsource/fastcs-example:2025.9.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsUser: 37887
        runAsGroup: 37887
        capabilities:
          drop: [ALL]
          add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, MKNOD,
                SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
      resources:
        requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 100Mi}
        limits: {cpu: 1, memory: 1Gi, ephemeral-storage: 2Gi}
      env:
        - {name: HOME, value: /tmp}
      command: [tickit, all, /epics/ioc/config/temp_controller.yaml]
      volumeMounts:
        - {name: config-volume, mountPath: /epics/ioc/config, readOnly: true}
        - {name: tmp, mountPath: /tmp}
