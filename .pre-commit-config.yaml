repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv.lock
      - id: check-yaml
        # Kubernetes manifests routinely carry several objects separated by
        # `---`, which is valid YAML but not a single document.
        args: [--allow-multiple-documents]
        # Helm templates are Go templates that happen to produce YAML; a file
        # beginning `{{- if .Values… }}` is not parseable as YAML and never will
        # be. `helm lint` in the helm workflow is what actually validates them.
        exclude: ^Charts/[^/]+/templates/
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: ruff
        name: lint with ruff
        language: system
        entry: ruff check --force-exclude --fix
        types: [python]
        require_serial: true

      - id: ruff-format
        name: format with ruff
        language: system
        entry: ruff format --force-exclude
        types: [python]
        require_serial: true

      - id: uv-sync
        name: update uv.lock and venv
        pass_filenames: false
        language: system
        entry: uv sync
        files: ^(uv\.lock|pyproject\.toml)$

  # Charts/podbench/values.schema.json is generated, never hand-written. It is
  # what makes helm refuse `--set rbac.iterat=true` at install time instead of
  # producing a release that silently grants nothing.
  #
  # The hook is a shim around a helm plugin rather than a self-contained
  # environment, so helm and `helm plugin install
  # https://github.com/losisin/helm-values-schema-json` both have to be present
  # — the Dockerfile's developer stage installs them here, `_tox.yml` in CI.
  - repo: https://github.com/losisin/helm-values-schema-json
    rev: v2.5.0
    hooks:
      - id: helm-schema
        args: [--config, Charts/podbench/.schema.config.yaml]
        files: ^Charts/podbench/(values\.yaml|example\.values\.yaml|\.schema\.config\.yaml|values\.schema\.json)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
